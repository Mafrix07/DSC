<!-- Cookie Consent Banner -->
    <div class="cookie-consent" id="cookieConsent" role="region" aria-label="Gestion des cookies">
        <div class="cookie-content">
            <div class="cookie-text">
                <p><i class="fas fa-shield-halved cookie-icon-banner"></i> Conformément aux exigences de transparence et de protection de la vie privée, nous utilisons des cookies strictement techniques et, avec votre accord, des mesures d'audience anonymes.</p>
                <a href="#" id="showCookiePolicy" class="cookie-link">Consulter notre politique de gestion des cookies</a>
            </div>
            <div class="cookie-buttons">
                <button class="cookie-btn cookie-btn-refuse" id="refuseNonEssential">Refuser</button>
                <button class="cookie-btn cookie-btn-settings" id="cookieSettings">Personnaliser</button>
                <button class="cookie-btn cookie-btn-accept" id="acceptAllCookies">Tout accepter</button>
            </div>
        </div>
    </div>
